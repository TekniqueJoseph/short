<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 style="color: goldenrod;">Audio Player</h2>
    <audio controls>
        <source src="audio/audio.mp3">
          Your browser does not support the audio element.
    </audio>

    <h2 style="color: blueviolet;">Video Player</h2>
    <video controls width="450" height="275">
        <source src="video/video.mp4">
        This video player is not supported in this browser.
    </video>
</body>
</html>
